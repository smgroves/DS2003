<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshot Hunt Record</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@700&display=swap">
<link rel="stylesheet" href="hunt.css">
<style>
main { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; display: grid; gap: 22px; }
.top a { font-size: 14px; }
.top h1 { font-size: 30px; margin: 4px 0 2px; }
section.round { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; scroll-margin-top: 12px; }
section.round:target { box-shadow: inset 4px 0 0 var(--purple); }
.date { font: 12px ui-monospace, Menlo, monospace; color: var(--mute); }
.q { font: 700 21px/1.3 "Source Serif 4", Georgia, serif; margin: 4px 0 12px; }
h3 { font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; margin: 14px 0 8px; }
h3.best { color: var(--gold); }
.grid { display: grid; gap: 12px; }
.grid.best { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.grid.all { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
figure { margin: 0; }
figure img { width: 100%; object-fit: contain; background: var(--bg); border-radius: 6px; display: block; cursor: zoom-in;
  border: 1px solid var(--line); }
.grid.best img { height: 380px; border: 3px solid var(--gold); }
.grid.all img { height: 200px; }
figcaption { font-size: 13px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
.big { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 9; cursor: zoom-out; }
.big img { max-width: 96vw; max-height: 94vh; }
@media (max-width: 520px) { .grid.best img { height: 300px; } .grid.all { grid-template-columns: repeat(3, 1fr); } .grid.all img { height: 150px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="../index.html">← DS 2003 course site</a>
    <h1>Screenshot Hunt</h1>
    <div class="muted">Past rounds from class, newest first. Playing live? <a href="./">Join the game</a>.</div>
  </div>
  <div id="app"><p class="muted">Loading…</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="hunt.js"></script>
<script>
const app = document.getElementById("app");

function fig(s) {
  return `<figure><img src="${Hunt.imageUrl(s.path)}" alt="${s.name ? "Screenshot from " + Hunt.esc(s.name) : "Student screenshot"}"
    loading="lazy" data-big="${Hunt.esc(s.path)}">${s.name ? `<figcaption>${Hunt.esc(s.name)}</figcaption>` : ""}</figure>`;
}

async function load() {
  const { data, error } = await Hunt.db.rpc("hunt_archive");
  if (error) { app.innerHTML = `<div class="card warn">Couldn't load the record: ${Hunt.esc(error.message)}</div>`; return; }
  const rounds = [];
  for (const row of data) {
    let r = rounds[rounds.length - 1];
    if (!r || r.id !== row.round_id) rounds.push(r = { id: row.round_id, prompt: row.prompt, at: row.started_at, subs: [] });
    if (row.sub_id) r.subs.push(row);
  }
  if (!rounds.length) { app.innerHTML = `<p class="muted">No rounds saved yet.</p>`; return; }
  app.innerHTML = rounds.map((r) => {
    const best = r.subs.filter((s) => s.starred), rest = r.subs.filter((s) => !s.starred);
    const when = new Date(r.at).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    return `<section class="round" id="round-${r.id}">
      <div class="date">${when}</div>
      <div class="q">${Hunt.esc(r.prompt)}</div>
      ${best.length ? `<h3 class="best">★ Best picks</h3><div class="grid best">${best.map(fig).join("")}</div>` : ""}
      ${rest.length ? `<h3>${best.length ? "All other submissions" : "Submissions"} (${rest.length})</h3>
        <div class="grid all">${rest.map(fig).join("")}</div>` : ""}
      ${!r.subs.length ? `<p class="muted">No submissions.</p>` : ""}
    </section>`;
  }).join("");
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}

app.onclick = (e) => {
  const img = e.target.closest("[data-big]");
  if (!img) return;
  const ov = document.createElement("div"); ov.className = "big";
  ov.innerHTML = `<img src="${Hunt.imageUrl(img.dataset.big)}" alt="">`;
  ov.onclick = () => ov.remove(); document.body.appendChild(ov);
};

if (!Hunt.configured) Hunt.notConfigured(app); else load();
</script>
</body>
</html>
